<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imagens | Caminhão em Dia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--a:#141925;--a2:#212a3b;--y:#f5b700;--p:#f4f5f8;--t:#1b2030;--s:#5d6679;--b:#d9dee7;--h:'Barlow Condensed','Arial Narrow',Arial,sans-serif;--c:'Barlow',system-ui,Arial,sans-serif}
*{box-sizing:border-box;margin:0}
body{font-family:var(--c);color:var(--t);background:var(--p);line-height:1.65;font-size:17px}
a{color:inherit}:focus-visible{outline:3px solid var(--y);outline-offset:3px}
.topo{background:var(--a);position:sticky;top:0;z-index:10;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.topo .in{max-width:1080px;margin:auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.marca{font-family:var(--h);font-weight:800;font-size:27px;color:#fff;text-decoration:none}.marca b{color:var(--y)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{text-decoration:none;padding:8px 16px;border-radius:999px;font-weight:600;font-size:15px;color:#c3cad8;transition:.2s}
nav a:hover{color:#fff;background:var(--a2)}nav a[aria-current=page]{background:var(--y);color:var(--a)}
.hero{background:radial-gradient(900px 400px at 85% -10%,#2c3a56,transparent),var(--a);color:#fff;padding:80px 24px 0;position:relative;overflow:hidden}
.hero .in{max-width:1080px;margin:auto;padding-bottom:70px}
.hero h1{font-family:var(--h);font-weight:800;font-size:clamp(46px,9vw,104px);line-height:.92;max-width:11ch;animation:sobe .9s cubic-bezier(.2,.8,.2,1) both}
.hero p{margin-top:24px;max-width:50ch;color:#b4bdcd;font-size:19px;animation:sobe .9s .15s cubic-bezier(.2,.8,.2,1) both}
.hero.curto{padding-top:56px}.hero.curto .in{padding-bottom:50px}.hero.curto h1{font-size:clamp(42px,7vw,72px);max-width:none}
@keyframes sobe{from{opacity:0;transform:translateY(26px)}}
.estrada{height:54px;background:#0d111a;position:relative;border-top:4px solid var(--y)}
.estrada::before{content:"";position:absolute;left:0;right:0;top:26px;height:5px;background:repeating-linear-gradient(90deg,#fff 0 40px,transparent 40px 80px);animation:faixa 1.2s linear infinite}
.estrada span{position:absolute;top:-14px;font-size:52px;line-height:1;animation:rota 9s linear infinite;filter:drop-shadow(0 6px 4px rgba(0,0,0,.5));transform:scaleX(-1)}
@keyframes faixa{to{background-position:-80px 0}}
@keyframes rota{from{left:-80px}to{left:100%}}
main{max-width:1080px;margin:auto;padding:64px 24px}
.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.galeria figure{background:#fff;border:1px solid var(--b);border-radius:16px;overflow:hidden;transition:.25s}
.galeria figure:hover{box-shadow:0 16px 34px rgba(20,25,37,.15);transform:translateY(-4px)}
.galeria img{display:block;width:100%;height:240px;object-fit:cover;background:linear-gradient(135deg,var(--a),#34425e);color:#fff;transition:.4s}
.galeria figure:hover img{transform:scale(1.06)}
.galeria figcaption{padding:14px 18px;font-weight:600;background:#fff;position:relative}
.galeria small{display:block;color:var(--s);font-weight:400}
.galeria .largo{grid-column:span 2}
@media(max-width:600px){.galeria .largo{grid-column:auto}}
footer{background:var(--a);color:#98a1b3;text-align:center;padding:34px 24px;font-size:15px}footer a{color:var(--y);font-weight:600}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="topo"><div class="in">
<a class="marca" href="index.html">Caminhão <b>em Dia</b></a>
<nav aria-label="Principal">
<a href="index.html">Início</a>
<a href="imagens.html" aria-current="page">Imagens</a>
<a href="links.html">Links úteis</a>
<a href="fale-conosco.html">Fale conosco</a>
</nav></div></header>
<section class="hero curto"><div class="in"><h1>Galeria de imagens</h1><p>Fotos da frota, das inspeções e dos nossos serviços.</p></div><div class="estrada" aria-hidden="true"><span>🚚</span></div></section>
<main><div class="galeria">
<figure class="largo"><img src="IMG_5030.jpg" alt="Frota em operação"><figcaption>Frota em operação<small>Caminhões prontos para a estrada.</small></figcaption></figure>
<figure><img src="images.jpeg" alt="Manutenção"><figcaption>Manutenção<small>Revisão feita por quem entende.</small></figcaption></figure>
<figure><img src="freio_464_1_20170222162618.jpg.webp" alt="Pneus e freios"><figcaption>Pneus e freios<small>Segurança em cada frenagem.</small></figcaption></figure>
<figure><img src="foto_eletrica.jpg" alt="Sistema elétrico"><figcaption>Sistema elétrico<small>Bateria, alternador e fiação em dia.</small></figcaption></figure>
<figure class="largo"><img src="inspecao.jpg" alt="Inspeção diária"><figcaption>Inspeção diária<small>Conferir antes de sair evita parar na estrada.</small></figcaption></figure>
</div></main>
<footer>© 2026 gui_souza_i · Uberaba, MG · <a href="index.html">Página inicial</a></footer>
</body>
</html>
